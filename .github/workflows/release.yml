name: Release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag vs app version
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts || { echo "Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"; exit 1; }
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Decode keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > release.keystore; echo "SIGNED=true" >> $GITHUB_ENV; else echo "SIGNED=false" >> $GITHUB_ENV; fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            # Inject signing via properties without committing secrets
            cat >> gradle.properties <<EOF
          storeFile=../release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi
          ./gradlew assembleRelease --stacktrace
      - name: Verify + checksum
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK" >> $GITHUB_ENV
          test -s "$APK"
          sha256sum "$APK" | tee checksum.txt
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK }}
            checksum.txt
          body: |
            HisaabDesk ${{ github.ref_name }}
            Signing: if KEYSTORE secrets were not configured this is an unsigned release APK (cannot be installed as production update-track build); the CI debug APK is available from the Android CI workflow artifacts for testing.
            See README for installation and limitations.
