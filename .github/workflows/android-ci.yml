name: Android CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pull-requests: write, issues: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Android SDK
        run: |
          echo "Preinstalled SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Validate Gradle Wrapper
        run: |
          java -jar gradle/wrapper/gradle-wrapper.jar --version || ./gradlew --version
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build-log.txt"
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build-log.txt"
      - name: Post build log to PR on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tail -c 45000 "$GITHUB_WORKSPACE/build-log.txt" > /tmp/snippet.txt || echo "no log" > /tmp/snippet.txt
          python3 - << 'PYEOF'
          import json, urllib.request, os
          body = open('/tmp/snippet.txt', encoding='utf-8', errors='replace').read()
          payload = json.dumps({"body": "CI build log (tail):\n\n```text\n" + body.replace("```", "'''") + "\n```"}).encode()
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments", data=payload, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PYEOF
      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with: { name: hisaabdesk-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 30 }
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
